name: STM Import Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js bereitstellen
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Google-Zugang bereitstellen
        env:
          GOOGLE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p credentials
          printf '%s' "$GOOGLE_KEY" > credentials/google-drive-service-account.json
          node -e "JSON.parse(require('fs').readFileSync('credentials/google-drive-service-account.json', 'utf8')); console.log('Google-Schlüssel ist gültiges JSON.')"

      - name: Umgebung prüfen
        run: |
          node --version
          npm --version
          test -f tools/drive-content.js
          test -f tools/drive-calendar.js

      - name: Importer auf Syntax prüfen
        run: |
          node --check tools/drive-content.js
          node --check tools/drive-calendar.js

      - name: Test abgeschlossen
        run: echo "STM Importer sind auf GitHub ausführbar."
